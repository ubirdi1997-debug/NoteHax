name: notehax
description: NoteHax - Smart Hacker Notebook with advanced features
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  url_launcher: ^6.2.2
  
  # Smart Features
  speech_to_text: ^7.0.0
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.0.5
  
  # Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  encrypt: ^5.0.3
  
  # Markdown & Rich Text
  flutter_markdown: ^0.6.18
  markdown: ^7.1.1
  
  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.2
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Backup
  share_plus: ^10.0.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
